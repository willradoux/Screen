# Produção (VPS). Uso:
#   cp infra/.env.example infra/.env   # e preencher
#   docker compose -f infra/docker-compose.yml --env-file infra/.env up -d --build
# Documentação: docs/infra/README.md

name: screem

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongo_data:/data/db
    networks: [internal]
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: &logging
      driver: json-file
      options: { max-size: '10m', max-file: '5' }

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: ../apps/api/.env
    environment:
      MONGODB_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/screem?authSource=admin
      LIVEKIT_URL: http://livekit:7880
      LIVEKIT_PUBLIC_URL: wss://${LIVE_DOMAIN}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
    depends_on:
      mongo: { condition: service_healthy }
      livekit: { condition: service_started }
    networks: [internal]
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
    logging: *logging

  livekit:
    image: livekit/livekit-server:v1.9
    restart: unless-stopped
    # Configuração inline para poder usar variáveis do compose (segredos).
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        log_level: info
        rtc:
          tcp_port: 7881
          udp_port: 7882
          use_external_ip: true
          turn_servers:
            - host: ${TURN_DOMAIN}
              port: 3478
              protocol: udp
              username: livekit
              credential: ${TURN_PASSWORD}
            - host: ${TURN_DOMAIN}
              port: 3478
              protocol: tcp
              username: livekit
              credential: ${TURN_PASSWORD}
        keys:
          ${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}
        webhook:
          api_key: ${LIVEKIT_API_KEY}
          urls:
            - http://api:3000/api/v1/livekit/webhook
    ports:
      - '7881:7881/tcp'
      - '7882:7882/udp'
    networks: [internal]
    logging: *logging

  coturn:
    image: coturn/coturn:4.6
    restart: unless-stopped
    # host network: o relay UDP precisa de uma faixa de portas sem NAT do Docker.
    network_mode: host
    command:
      - -n
      - --log-file=stdout
      - --listening-port=3478
      - --realm=${TURN_DOMAIN}
      - --server-name=${TURN_DOMAIN}
      - --external-ip=${TURN_EXTERNAL_IP}
      - --min-port=49152
      - --max-port=49252
      - --fingerprint
      - --lt-cred-mech
      - --user=livekit:${TURN_PASSWORD}
      - --no-multicast-peers
      - --no-cli
      - --denied-peer-ip=0.0.0.0-0.255.255.255
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=100.64.0.0-100.127.255.255
      - --denied-peer-ip=127.0.0.0-127.255.255.255
      - --denied-peer-ip=169.254.0.0-169.254.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255
    logging: *logging

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      API_DOMAIN: ${API_DOMAIN}
      LIVE_DOMAIN: ${LIVE_DOMAIN}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api, livekit]
    networks: [internal]
    logging: *logging

networks:
  internal: {}

volumes:
  mongo_data: {}
  caddy_data: {}
  caddy_config: {}
