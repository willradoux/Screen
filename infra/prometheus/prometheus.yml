# Prometheus do Screem (perfil "monitoring" do docker-compose).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: screem-api
    # Porta interna das métricas (METRICS_PORT). Não é a porta pública da API.
    static_configs:
      - targets: ['api:9100']

  # O LiveKit expõe as próprias métricas se `prometheus_port` estiver no livekit.yaml:
  # - job_name: livekit
  #   static_configs:
  #     - targets: ['livekit:6789']
