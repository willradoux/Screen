# Blueprint do Render (opcional). Guia e LIMITAÇÕES: docs/infra/deploy-render.md
#
# O Render NÃO suporta UDP nem portas TCP arbitrárias, então o LiveKit (mídia) não roda aqui.
# Este blueprint cobre só API + bot e o frontend. Use LiveKit Cloud (ou o LiveKit na sua VPS)
# e um MongoDB Atlas. Variáveis com sync:false são preenchidas por você no painel.

services:
  - type: web
    name: screem-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    # O bot precisa ficar sempre ligado: o plano free "dorme" e derruba o bot. Use no mínimo starter.
    plan: starter
    healthCheckPath: /api/v1/health
    envVars:
      - { key: NODE_ENV, value: production }
      - { key: TRUST_PROXY, value: '1' }
      - { key: TIMEZONE, value: America/Sao_Paulo }
      - { key: PUBLIC_API_URL, sync: false } # https://api.exemplo.com (domínio próprio)
      - { key: WEB_URL, sync: false } # https://app.exemplo.com
      - { key: SESSION_COOKIE_DOMAIN, sync: false } # .exemplo.com
      - { key: DISCORD_REDIRECT_URI, sync: false } # https://api.exemplo.com/api/v1/auth/discord/callback
      - { key: MONGODB_URI, sync: false } # MongoDB Atlas
      - { key: LIVEKIT_URL, sync: false } # https://SEU-PROJETO.livekit.cloud
      - { key: LIVEKIT_PUBLIC_URL, sync: false } # wss://SEU-PROJETO.livekit.cloud
      - { key: LIVEKIT_API_KEY, sync: false }
      - { key: LIVEKIT_API_SECRET, sync: false }
      - { key: DISCORD_CLIENT_ID, sync: false }
      - { key: DISCORD_CLIENT_SECRET, sync: false }
      - { key: DISCORD_GUILD_ID, sync: false }
      - { key: DISCORD_BOT_TOKEN, sync: false }
      - { key: BOOTSTRAP_ADMIN_IDS, sync: false }
      - { key: COOKIE_SECRET, generateValue: true }
      - { key: TOKEN_ENCRYPTION_KEY, sync: false } # openssl rand -base64 32

  - type: web
    name: screem-web
    runtime: static
    buildCommand: npm ci && npm run build:shared && npm run build -w @screem/web
    staticPublishPath: apps/web/dist
    envVars:
      - { key: VITE_API_URL, sync: false } # https://api.exemplo.com/api/v1
      - { key: VITE_SOCKET_URL, sync: false } # https://api.exemplo.com
    routes:
      - { type: rewrite, source: /*, destination: /index.html }
    headers:
      - { path: /*, name: X-Content-Type-Options, value: nosniff }
      - { path: /*, name: X-Frame-Options, value: DENY }
      - { path: /*, name: Referrer-Policy, value: strict-origin-when-cross-origin }
      - {
          path: /*,
          name: Permissions-Policy,
          value: 'camera=(self), microphone=(self), display-capture=(self), geolocation=(), payment=()',
        }
      - {
          path: /*,
          name: Content-Security-Policy,
          value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://cdn.discordapp.com; media-src 'self' blob:; connect-src 'self' https: wss:; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'",
        }
